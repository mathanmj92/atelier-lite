<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tabs</title>
    <link rel="stylesheet" href="./shell.css" />
  </head>
  <body class="tabsbar">
    <div id="strip">
      <button id="homebtn" class="homebtn" title="Home (Alt+H)" aria-label="Home"></button>
      <button id="wschip" class="ws-chip" title="Workspace: switch, save, protect or close it"></button>
      <div id="tabs" role="tablist" aria-label="Open documents"></div>
      <button id="newtab" class="newtab" aria-label="New tab" title="New tab (Alt+T)">+</button>
    </div>
    <script src="./common.js"></script>
    <script src="./tabs.js"></script>
  </body>
</html>
